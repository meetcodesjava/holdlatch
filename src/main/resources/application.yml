server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: holdlatch
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/holdlatch}
    username: ${DB_USER:holdlatch}
    password: ${DB_PASSWORD:holdlatch}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
  flyway:
    enabled: true

holdlatch:
  security:
    jwt-secret: ${JWT_SECRET:}
    issuer: holdlatch
    access-token-ttl: ${JWT_TTL:PT1H}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    rate-limit:
      api-capacity: ${RATE_API_CAPACITY:100}
      api-refill-per-second: ${RATE_API_REFILL_PER_SECOND:50}
      auth-capacity: ${RATE_AUTH_CAPACITY:10}
      auth-refill-per-second: ${RATE_AUTH_REFILL_PER_SECOND:0.2}

  hold:
    token-secret: ${HOLD_TOKEN_SECRET:}
    ttl: ${HOLD_TTL:PT5M}
    max-tickets-per-hold: ${HOLD_MAX_TICKETS:8}
    reject-orphan-seats: ${HOLD_REJECT_ORPHAN_SEATS:true}
    standing-room-attempts: ${HOLD_STANDING_ATTEMPTS:6}
    seat-map-cache-ttl: ${SEAT_MAP_CACHE_TTL:PT1S}

aerokv:
  host: ${AEROKV_HOST:localhost}
  port: ${AEROKV_PORT:8080}
  password: ${AEROKV_PASSWORD:}
  connect-timeout-ms: ${AEROKV_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${AEROKV_READ_TIMEOUT_MS:2000}
  pool:
    max-total: ${AEROKV_POOL_MAX_TOTAL:64}
    min-idle: ${AEROKV_POOL_MIN_IDLE:4}
    borrow-timeout-ms: ${AEROKV_POOL_BORROW_TIMEOUT_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
