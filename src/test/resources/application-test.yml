holdlatch:
  scheduling:
    enabled: false
  hold:
    catalog-cache-ttl: PT0S
    token-secret: test-only-hold-token-secret-32-bytes-min!!
  security:
    jwt-secret: test-only-secret-that-is-at-least-32-bytes-long!!
    bcrypt-strength: 4
    rate-limit:
      api-capacity: 1000
      api-refill-per-second: 1000
      auth-capacity: 10
      auth-refill-per-second: 0.001
